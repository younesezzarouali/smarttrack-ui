<nav class="navbar navbar-dark py-4">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center fw-bold fs-4" href="#">
      <div class="bg-primary rounded-3 p-2 me-2 d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
        <i class="bi bi-graph-up-arrow fs-6"></i>
      </div>
      SmartTrack
    </a>
    <button class="btn btn-primary-fintech d-flex align-items-center" (click)="openModal(content)">
      <i class="bi bi-plus-lg me-2"></i> New Transaction
    </button>
  </div>
</nav>

<main class="container mt-4 mb-5">
  <!-- Statistics Row -->
  <div class="mb-5">
    <app-expense-summary></app-expense-summary>
  </div>

  <!-- Recent Transactions Section -->
  <div class="fintech-card overflow-hidden">
    <div class="p-4 border-bottom border-light border-opacity-10 d-flex justify-content-between align-items-center">
      <h5 class="m-0 fw-bold">Recent Transactions</h5>
      <a href="#" class="text-primary text-decoration-none small fw-semibold">View all</a>
    </div>
    
    <div class="table-responsive">
      <table class="fintech-table">
        <thead>
          <tr>
            <th>Description</th>
            <th>Category</th>
            <th class="text-end">Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let ex of expenses">
            <td class="fw-medium text-white">{{ ex.label }}</td>
            <td>
              <span class="fintech-badge">{{ ex.category }}</span>
            </td>
            <td class="text-end fw-bold text-white">
              {{ ex.amount | number:'1.2-2' }} €
            </td>
          </tr>
          <tr *ngIf="expenses.length === 0">
            <td colspan="3" class="text-center py-5 text-muted">
              No transactions recorded yet.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<ng-template #content let-modal>
  <div class="modal-header">
    <h5 class="modal-title fw-bold">Add Transaction</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>
  <app-expense-modal></app-expense-modal>
</ng-template>
