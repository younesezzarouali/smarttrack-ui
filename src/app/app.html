<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">SmartTrack</a>
  </div>
</nav>

<header class="bg-primary text-white py-5">
  <div class="container text-center">
    <h1 class="display-4 fw-bold">Suivez vos dépenses simplement</h1>
    <p class="lead mb-4">Vision Serverless 100% Fonctionnelle.</p>
  </div>
</header>

<main class="container my-5">
  <div class="row">
    <div class="col-md-12">
      <app-expense-summary></app-expense-summary>
    </div>
  </div>

  <div class="mt-5">
    <h2 class="mb-4">Dernières Transactions</h2>
    <div class="table-responsive">
      <table class="table table-hover bg-white shadow-sm rounded">
        <thead class="table-light">
          <tr>
            <th>Date</th>
            <th>Catégorie</th>
            <th>Montant</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let ex of expenses">
            <td>{{ ex.date }}</td>
            <td>{{ ex.category }}</td>
            <td class="fw-bold text-end">{{ ex.amount }} €</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<footer class="bg-light py-4 border-top mt-auto">
  <div class="container text-center text-muted">
    <span>© 2026 Ezzium Consulting — SmartTrack Platform</span>
  </div>
</footer>
