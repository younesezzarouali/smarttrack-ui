<nav class="navbar navbar-dark py-4">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center fw-bold fs-4" href="#">
      <div class="bg-primary rounded-3 p-2 me-2 d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
        <i class="bi bi-stars fs-6"></i>
      </div>
      SmartTrack LifeOS
    </a>
  </div>
</nav>

<main class="container mt-2 mb-5">
  <!-- Status Dashboard -->
  <div class="mb-5">
    <app-expense-summary></app-expense-summary>
  </div>

  <!-- Magic Input Section -->
  <div class="row justify-content-center mb-5">
    <div class="col-lg-8">
      <div class="fintech-card p-2 shadow-lg" 
           [ngStyle]="{'border': speechService.isListening() ? '2px solid var(--accent)' : '1px solid rgba(99, 102, 241, 0.3)'}">
        <div class="input-group">
          <button class="btn border-0 px-3" 
                  [ngClass]="speechService.isListening() ? 'text-accent pulse-mic' : 'text-secondary'"
                  (click)="toggleListening()">
            <i class="bi" [ngClass]="speechService.isListening() ? 'bi-mic-fill' : 'bi-mic'"></i>
          </button>

          <input type="text" 
                 class="form-control border-0 bg-transparent fs-5 py-3" 
                 [placeholder]="speechService.isListening() ? 'Listening...' : 'How was your day?'"
                 [(ngModel)]="magicText"
                 (keyup.enter)="processMagic()"
                 [disabled]="loading">

          <button class="btn btn-primary-fintech px-4" 
                  type="button" 
                  (click)="processMagic()"
                  [disabled]="loading || !magicText">
            <span *ngIf="!loading"><i class="bi bi-send-fill"></i></span>
            <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Timeline of Events -->
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h6 class="text-secondary text-uppercase fw-bold m-0" style="letter-spacing: 1px;">Live Timeline</h6>
        <button *ngIf="events().length > 0" 
                class="btn btn-sm btn-outline-danger border-0 small opacity-75" 
                (click)="clearAll()">
          <i class="bi bi-trash3 me-1"></i> Clear Data
        </button>
      </div>
      
      <div class="timeline">
        <div *ngFor="let event of events()" class="fintech-card p-4 mb-3 animate-fade-in">
          <!-- View Mode -->
          <div *ngIf="editingEvent?.timestamp !== event.timestamp" class="d-flex align-items-start">
            <div class="rounded-circle p-3 me-3 d-flex align-items-center justify-content-center" 
                 [ngClass]="{
                   'bg-success-subtle text-success': event.type === 'FINANCE',
                   'bg-info-subtle text-info': event.type === 'HEALTH',
                   'bg-warning-subtle text-warning': event.type === 'WORK',
                   'bg-primary-subtle text-primary': event.type === 'NOTE'
                 }" style="width: 50px; height: 50px; background: rgba(255,255,255,0.05);">
              <i class="bi" [ngClass]="{
                'bi-currency-euro': event.type === 'FINANCE',
                'bi-heart-pulse': event.type === 'HEALTH',
                'bi-briefcase': event.type === 'WORK',
                'bi-sticky': event.type === 'NOTE'
              }"></i>
            </div>
            <div class="flex-grow-1">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <div>
                  <span class="badge fintech-badge me-2">{{ event.type }}</span>
                  <small class="text-secondary">{{ event.timestamp | date:'short' }}</small>
                </div>
                <button class="btn btn-sm text-secondary" (click)="startEdit(event)">
                  <i class="bi bi-pencil-square"></i>
                </button>
              </div>
              <p class="m-0 fw-medium text-white" style="font-size: 1.1rem;">{{ event.content }}</p>
              
              <div class="mt-2 d-flex flex-wrap gap-2">
                <small *ngFor="let entry of event.payload | keyvalue" class="text-white bg-dark px-2 py-1 rounded border border-light border-opacity-10" style="background: rgba(255,255,255,0.05) !important;">
                  <span class="text-secondary">{{ entry.key }}:</span> {{ entry.value }}
                </small>
              </div>
            </div>
          </div>

          <!-- Edit Mode -->
          <div *ngIf="editingEvent?.timestamp === event.timestamp" class="edit-mode">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label small text-secondary fw-bold">DESCRIPTION</label>
                <input type="text" class="form-control" [(ngModel)]="editingEvent!.content">
              </div>
              <div class="col-md-6" *ngIf="event.type === 'FINANCE'">
                <label class="form-label small text-secondary fw-bold">AMOUNT (€)</label>
                <input type="text" class="form-control" [(ngModel)]="editingEvent!.payload.amount">
              </div>
              <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                <button class="btn btn-sm btn-outline-secondary px-3" (click)="cancelEdit()">Cancel</button>
                <button class="btn btn-sm btn-primary-fintech px-4" (click)="saveEdit()">Save Changes</button>
              </div>
            </div>
          </div>
        </div>
        
        <div *ngIf="events().length === 0" class="text-center py-5">
          <div class="opacity-25 mb-3">
            <i class="bi bi-chat-dots display-1 text-muted"></i>
          </div>
          <p class="text-muted">No events recorded. Type something above to begin.</p>
        </div>
      </div>
    </div>
  </div>
</main>
