<nav class="navbar navbar-dark py-4">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center fw-bold fs-4" href="#">
      <div class="bg-primary rounded-3 p-2 me-2 d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
        <i class="bi bi-stars fs-6"></i>
      </div>
      SmartTrack LifeOS
    </a>
  </div>
</nav>

<main class="container mt-2 mb-5">
  <!-- Status Dashboard -->
  <div class="mb-5">
    <app-expense-summary></app-expense-summary>
  </div>

  <!-- Magic Input Section -->
  <div class="row justify-content-center mb-5">
    <div class="col-lg-8">
      <div class="fintech-card p-2 shadow-lg" style="border: 1px solid rgba(99, 102, 241, 0.3);">
        <div class="input-group">
          <input type="text" 
                 class="form-control border-0 bg-transparent fs-5 py-3 ps-4" 
                 placeholder="How was your day? (ex: Spent 10€ on coffee, ran 5km...)"
                 [(ngModel)]="magicText"
                 (keyup.enter)="processMagic()"
                 [disabled]="loading">
          <button class="btn btn-primary-fintech px-4" 
                  type="button" 
                  (click)="processMagic()"
                  [disabled]="loading || !magicText">
            <span *ngIf="!loading"><i class="bi bi-send-fill"></i></span>
            <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
          </button>
        </div>
      </div>
      <div class="text-center mt-3">
        <small class="text-muted">Powered by Gemini 2.0 Flash</small>
      </div>
    </div>
  </div>

  <!-- Timeline of Events -->
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <h6 class="text-muted text-uppercase fw-bold mb-4" style="letter-spacing: 1px;">Live Timeline</h6>
      
      <div class="timeline">
        <div *ngFor="let event of events" class="fintech-card p-4 mb-3 animate-fade-in">
          <div class="d-flex align-items-start">
            <div class="rounded-circle p-3 me-3 d-flex align-items-center justify-content-center" 
                 [ngClass]="{
                   'bg-success-subtle text-success': event.type === 'FINANCE',
                   'bg-info-subtle text-info': event.type === 'HEALTH',
                   'bg-warning-subtle text-warning': event.type === 'WORK',
                   'bg-primary-subtle text-primary': event.type === 'NOTE'
                 }" style="width: 50px; height: 50px; background: rgba(255,255,255,0.05);">
              <i class="bi" [ngClass]="{
                'bi-currency-euro': event.type === 'FINANCE',
                'bi-heart-pulse': event.type === 'HEALTH',
                'bi-briefcase': event.type === 'WORK',
                'bi-sticky': event.type === 'NOTE'
              }"></i>
            </div>
            <div class="flex-grow-1">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="badge fintech-badge">{{ event.type }}</span>
                <small class="text-secondary">{{ event.timestamp | date:'short' }}</small>
              </div>
              <p class="m-0 fw-medium text-white" style="font-size: 1.1rem;">{{ event.content }}</p>
              
              <!-- Payload details -->
              <div class="mt-2 d-flex flex-wrap gap-2">
                <small *ngFor="let entry of event.payload | keyvalue" class="text-white bg-dark px-2 py-1 rounded border border-light border-opacity-10" style="background: rgba(255,255,255,0.05) !important;">
                  <span class="text-secondary">{{ entry.key }}:</span> {{ entry.value }}
                </small>
              </div>
            </div>
          </div>
        </div>
        
        <div *ngIf="events.length === 0" class="text-center py-5">
          <div class="opacity-25 mb-3">
            <i class="bi bi-chat-dots display-1"></i>
          </div>
          <p class="text-muted">No events recorded. Type something above to begin.</p>
        </div>
      </div>
    </div>
  </div>
</main>
