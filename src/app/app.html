<nav class="navbar navbar-dark py-3 fixed-top bg-black bg-opacity-80" style="backdrop-filter: blur(20px); z-index: 1060;">
  <div class="container">
    <a class="navbar-brand fw-bold fs-5" href="#" style="letter-spacing: -0.03em;">SmartTrack</a>
    <div class="d-flex align-items-center gap-3">
      <button *ngIf="events().length > 0" class="btn btn-sm text-secondary opacity-40 p-0" (click)="clearAll()">
        <i class="bi bi-trash3"></i>
      </button>
      <button class="btn btn-sm text-secondary opacity-40 p-0" (click)="showDebug = !showDebug">
        <i class="bi bi-cpu"></i>
      </button>
    </div>
  </div>
</nav>

<main class="container mb-5 pb-5" style="padding-top: 100px;">
  
  <app-expense-summary></app-expense-summary>

  <!-- DAILY BRIEFING (Elevated Card) -->
  <div *ngIf="briefing()" class="row justify-content-center section-gap fade-in">
    <div class="col-lg-10">
      <div class="apple-card-elevated">
        <div class="d-flex align-items-center mb-3">
          <i class="bi bi-chat-right-quote-fill text-secondary me-2 small"></i>
          <span class="kpi-title m-0">Insight</span>
        </div>
        <p class="text-white m-0 lh-base fw-medium" style="font-size: 1.1rem;">
          {{ briefing() }}
        </p>
      </div>
    </div>
  </div>

  <!-- AI Answer Bubble -->
  <div *ngIf="aiAnswer" class="row justify-content-center section-gap fade-in">
    <div class="col-lg-10">
      <div class="apple-card border border-white border-opacity-10">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <span class="kpi-title text-white opacity-50">Assistant</span>
          <button type="button" class="btn-close small opacity-20" (click)="dismissAnswer()"></button>
        </div>
        <p class="text-white m-0 fs-5 lh-base">{{ aiAnswer }}</p>
      </div>
    </div>
  </div>

  <!-- History Timeline -->
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div *ngFor="let group of groupedEvents()" class="section-gap">
        <h6 class="kpi-title mb-3 px-1 opacity-40">{{ group.date }}</h6>
        
        <div class="apple-card p-0 overflow-hidden">
          <div *ngFor="let event of group.items" class="px-4 py-3 event-row">
            <!-- View mode -->
            <div *ngIf="editingEvent?.timestamp !== event.timestamp" class="w-100 d-flex align-items-center">
              <div class="rounded-3 p-2 me-3 d-flex align-items-center justify-content-center bg-black bg-opacity-20" 
                   style="width: 36px; height: 36px;">
                <i class="bi text-white opacity-60" [ngClass]="{
                  'bi-credit-card': event.type === 'FINANCE',
                  'bi-figure-run': event.type === 'HEALTH',
                  'bi-macbook': event.type === 'WORK',
                  'bi-text-left': event.type === 'NOTE'
                }"></i>
              </div>
              <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-center">
                  <span class="text-white fw-medium">{{ event.content }}</span>
                  <div class="text-white fw-bold">
                    <span *ngIf="event.type === 'FINANCE'">{{ event.payload.amount }}€</span>
                    <span *ngIf="event.type === 'HEALTH'">{{ event.payload.value }}{{ event.payload.unit }}</span>
                    <span *ngIf="event.type === 'WORK'">{{ event.payload.duration_min }}m</span>
                  </div>
                </div>
                <div class="d-flex align-items-center mt-1">
                  <small class="text-secondary opacity-40 me-3 small">{{ event.timestamp | date:'HH:mm' }}</small>
                  <small *ngIf="event.payload.emotion" class="text-secondary opacity-40 small italic">{{ event.payload.emotion }}</small>
                </div>
              </div>
              <button class="btn btn-sm text-secondary opacity-20 ms-3 p-0" (click)="startEdit(event)">
                <i class="bi bi-chevron-right"></i>
              </button>
            </div>

            <!-- Edit mode -->
            <div *ngIf="editingEvent?.timestamp === event.timestamp" class="w-100 py-2">
              <input type="text" class="form-control fs-5 fw-bold p-0 mb-3 text-white" [(ngModel)]="editingEvent!.content">
              <div class="row g-3">
                <div class="col-6" *ngIf="event.type === 'FINANCE'">
                  <label class="kpi-title">Amount (€)</label>
                  <input type="text" class="form-control bg-black bg-opacity-20 rounded-3 text-white" [(ngModel)]="editingEvent!.payload.amount">
                </div>
              </div>
              <div class="d-flex gap-3 mt-4">
                <button class="btn btn-sm btn-light px-4" (click)="saveEdit()">Save</button>
                <button class="btn btn-sm text-secondary" (click)="cancelEdit()">Cancel</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Bottom Magic Pill Input -->
<div class="fixed-bottom p-4 pb-5" style="z-index: 1050;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <div *ngIf="undoVisible()" class="mb-3 text-center fade-in">
          <button class="btn btn-dark rounded-pill border border-white border-opacity-10 px-4 py-2 small" (click)="undoSave()">
            <span class="text-secondary">Saved.</span> <span class="text-white fw-bold ms-2">UNDO</span>
          </button>
        </div>

        <div class="pill-container shadow-2xl">
          <div class="input-group align-items-center">
            <button class="btn border-0 text-secondary opacity-60 px-3" (click)="toggleListening()">
              <i class="bi fs-5" [ngClass]="speechService.isListening() ? 'bi-mic-fill text-system-red' : 'bi-mic'"></i>
            </button>
            
            <input type="text" 
                   class="form-control" 
                   [placeholder]="speechService.isListening() ? 'Listening...' : placeholderSignal()" 
                   [(ngModel)]="magicText" (keyup.enter)="processMagic()" [disabled]="loading">

            <button class="btn-circle me-1" (click)="processMagic()" [disabled]="loading || !magicText">
              <i *ngIf="!loading" class="bi bi-arrow-up text-black fs-5"></i>
              <span *ngIf="loading" class="spinner-border spinner-border-sm text-black"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
