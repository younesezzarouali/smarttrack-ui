<div class="modal-container-p">
  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div style="width: 24px;"></div>
    <h4 class="text-title-2 mb-0">Create Habit</h4>
    <button (click)="activeModal.dismiss()" class="btn-link-p p-0">
      <i class="bi bi-x-lg" style="font-size: 18px;"></i>
    </button>
  </div>
  
  <div class="form-group-p">
    <p class="text-label-caps mb-2">Habit Update</p>
    <div class="input-container-p">
      <input type="text" class="input-p" 
             placeholder="ex: Sport" 
             [ngModel]="name()" (ngModelChange)="name.set($event)" autofocus>
    </div>
  </div>

  <!-- INPUT ROWS -->
  <div class="mb-5 d-flex flex-column">
    
    <div class="d-flex justify-content-between align-items-center py-3 border-bottom border-white border-opacity-5">
      <span class="text-body-p">Type</span>
      <div class="d-flex align-items-center gap-2">
        <select class="input-p text-end" style="width: 100px;"
                [ngModel]="type()" (ngModelChange)="type.set($event)">
          <option value="TIME" style="background: var(--elevated-surface);">Time (min)</option>
          <option value="COUNT" style="background: var(--elevated-surface);">Count</option>
        </select>
        <i class="bi bi-chevron-right opacity-40" style="font-size: 12px;"></i>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center py-3 border-bottom border-white border-opacity-5">
      <span class="text-body-p">Target</span>
      <div class="d-flex align-items-center gap-2">
        <input type="number" class="input-p text-end" style="width: 60px;"
               [ngModel]="target()" (ngModelChange)="target.set($event)">
        <i class="bi bi-chevron-right opacity-40" style="font-size: 12px;"></i>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center py-3">
      <span class="text-body-p">Frequency</span>
      <div class="d-flex align-items-center gap-2">
        <span class="text-body-p text-secondary">{{ frequency() }}</span>
        <i class="bi bi-chevron-right opacity-40" style="font-size: 12px;"></i>
      </div>
    </div>

  </div>

  <!-- ACTIONS -->
  <div class="row g-3">
    <div class="col-6">
      <button class="btn-secondary-p w-100" (click)="activeModal.dismiss()">
        Cancel
      </button>
    </div>
    <div class="col-6">
      <button class="btn-premium w-100" (click)="create()" [disabled]="loading() || !name()">
        <span *ngIf="!loading()">Create</span>
        <span *ngIf="loading()" class="spinner-border spinner-border-sm text-white"></span>
      </button>
    </div>
  </div>
</div>
