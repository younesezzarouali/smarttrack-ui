<div class="modal-body p-3" style="background: #1C1C1E; color: white; border-radius: 24px;">
  <div class="rev-modal-title-mini">New Habit</div>
  
  <div class="mb-2">
    <label class="text-secondary small fw-bold uppercase mb-1 px-1" style="font-size: 8px;">Name</label>
    <div class="rev-input-mini">
      <input type="text" class="form-control border-0 bg-transparent text-white p-0 fw-bold" 
             style="font-size: 14px;" placeholder="e.g. Gym" 
             [ngModel]="name()" (ngModelChange)="name.set($event)" autofocus>
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-6">
      <label class="text-secondary small fw-bold uppercase mb-1 px-1" style="font-size: 8px;">Type</label>
      <div class="rev-input-mini">
        <select class="form-select border-0 bg-transparent text-white p-0 small fw-bold" 
                style="font-size: 13px;" [ngModel]="type()" (ngModelChange)="type.set($event)">
          <option value="TIME">Time</option>
          <option value="COUNT">Count</option>
        </select>
      </div>
    </div>
    <div class="col-6">
      <label class="text-secondary small fw-bold uppercase mb-1 px-1" style="font-size: 8px;">Goal</label>
      <div class="rev-input-mini">
        <input type="number" class="form-control border-0 bg-transparent text-white p-0 fw-bold" 
               style="font-size: 13px;" [ngModel]="target()" (ngModelChange)="target.set($event)">
      </div>
    </div>
  </div>

  <div class="d-flex flex-column gap-1">
    <button class="btn-rev-main-mini" (click)="create()" [disabled]="loading() || !name()">
      <span *ngIf="!loading()">Create</span>
      <span *ngIf="loading()" class="spinner-border spinner-border-sm text-black"></span>
    </button>
    <button class="btn btn-link text-secondary text-decoration-none py-1 small fw-bold" 
            style="font-size: 12px;" (click)="activeModal.dismiss()">Cancel</button>
  </div>
</div>
