<div class="modal-body p-4" style="background: #1C1C1E; color: white; border-radius: 28px;">
  <div class="rev-modal-title-mini" style="font-size: 20px;">New Habit</div>
  
  <div class="mb-3">
    <label class="text-secondary small fw-bold uppercase mb-2 px-1" style="font-size: 10px; letter-spacing: 0.5px;">Habit Name</label>
    <div class="rev-input-mini">
      <input type="text" class="form-control border-0 bg-transparent text-white p-0 fw-bold" 
             style="font-size: 16px;" placeholder="e.g. Reading" 
             [ngModel]="name()" (ngModelChange)="name.set($event)" autofocus>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6">
      <label class="text-secondary small fw-bold uppercase mb-2 px-1" style="font-size: 10px; letter-spacing: 0.5px;">Measure</label>
      <div class="rev-input-mini">
        <select class="form-select border-0 bg-transparent text-white p-0 small fw-bold" 
                style="font-size: 15px;" [ngModel]="type()" (ngModelChange)="type.set($event)">
          <option value="TIME">Time (min)</option>
          <option value="COUNT">Count</option>
        </select>
      </div>
    </div>
    <div class="col-6">
      <label class="text-secondary small fw-bold uppercase mb-2 px-1" style="font-size: 10px; letter-spacing: 0.5px;">Goal</label>
      <div class="rev-input-mini">
        <input type="number" class="form-control border-0 bg-transparent text-white p-0 fw-bold" 
               style="font-size: 15px;" [ngModel]="target()" (ngModelChange)="target.set($event)">
      </div>
    </div>
  </div>

  <div class="d-flex flex-column gap-2">
    <button class="btn-rev-main-mini" style="padding: 14px !important;" (click)="create()" [disabled]="loading() || !name()">
      <span *ngIf="!loading()">Create Habit</span>
      <span *ngIf="loading()" class="spinner-border spinner-border-sm text-black"></span>
    </button>
    <button class="btn btn-link text-secondary text-decoration-none py-2 fw-bold" 
            style="font-size: 14px;" (click)="activeModal.dismiss()">Cancel</button>
  </div>
</div>
