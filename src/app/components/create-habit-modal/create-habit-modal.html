<div class="modal-body p-4" style="background: #111111; color: white; border-radius: 28px;">
  <div class="text-center mb-4">
    <div style="width: 40px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin: 0 auto 16px;"></div>
    <h5 class="fw-bold">Create Habit</h5>
  </div>
  
  <div class="mb-4">
    <label class="text-secondary small fw-bold uppercase mb-2 px-1" style="letter-spacing: 0.5px;">Name</label>
    <div style="background: #1C1C1E; border-radius: 16px; padding: 4px 16px; border: 1px solid rgba(255,255,255,0.05);">
      <input type="text" class="form-control border-0 bg-transparent text-white py-3" 
             placeholder="e.g. Gym" [ngModel]="name()" (ngModelChange)="name.set($event)" autofocus>
    </div>
  </div>

  <div class="row g-3 mb-5">
    <div class="col-6">
      <label class="text-secondary small fw-bold uppercase mb-2 px-1" style="letter-spacing: 0.5px;">Type</label>
      <select class="form-select border-0 text-white" 
              style="background: #1C1C1E; border-radius: 16px; height: 56px; border: 1px solid rgba(255,255,255,0.05);"
              [ngModel]="type()" (ngModelChange)="type.set($event)">
        <option value="TIME">Time (min)</option>
        <option value="COUNT">Count</option>
      </select>
    </div>
    <div class="col-6">
      <label class="text-secondary small fw-bold uppercase mb-2 px-1" style="letter-spacing: 0.5px;">Target</label>
      <div style="background: #1C1C1E; border-radius: 16px; padding: 4px 16px; border: 1px solid rgba(255,255,255,0.05);">
        <input type="number" class="form-control border-0 bg-transparent text-white py-3" 
               [ngModel]="target()" (ngModelChange)="target.set($event)">
      </div>
    </div>
  </div>

  <div class="d-flex flex-column gap-2">
    <button class="btn btn-rev-white" (click)="create()" [disabled]="loading() || !name()">
      <span *ngIf="!loading()">Create Habit</span>
      <span *ngIf="loading()" class="spinner-border spinner-border-sm"></span>
    </button>
    <button class="btn btn-link text-secondary text-decoration-none" (click)="activeModal.dismiss()">Cancel</button>
  </div>
</div>
