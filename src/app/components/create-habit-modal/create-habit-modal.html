<div class="modal-body p-4" style="background: #111111; color: white; border-radius: 28px; border: 1px solid rgba(255,255,255,0.05);">
  <!-- Drag Handle -->
  <div class="text-center mb-4">
    <div style="width: 40px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin: 0 auto 16px;"></div>
    <h5 class="fw-bold" style="letter-spacing: -0.5px;">New Habit</h5>
  </div>
  
  <!-- Habit Name -->
  <div class="mb-4">
    <label class="text-secondary small fw-bold uppercase mb-2 px-1" style="letter-spacing: 0.5px; font-size: 10px;">Habit Name</label>
    <div style="background: #1C1C1E; border-radius: 16px; padding: 4px 16px; border: 1px solid rgba(255,255,255,0.05);">
      <input type="text" class="form-control border-0 bg-transparent text-white py-3 fw-bold" 
             style="font-size: 18px;"
             placeholder="e.g. Morning Run" [ngModel]="name()" (ngModelChange)="name.set($event)" autofocus>
    </div>
  </div>

  <!-- Type Selection (Pills) -->
  <div class="mb-4">
    <label class="text-secondary small fw-bold uppercase mb-2 px-1" style="letter-spacing: 0.5px; font-size: 10px;">Measure By</label>
    <div class="d-flex gap-2 p-1" style="background: #1C1C1E; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05);">
      <button class="btn flex-grow-1 rounded-3 py-2 fw-bold transition-all" 
              [style.background]="type() === 'TIME' ? 'white' : 'transparent'"
              [style.color]="type() === 'TIME' ? 'black' : '#8E8E93'"
              (click)="type.set('TIME')">Time</button>
      <button class="btn flex-grow-1 rounded-3 py-2 fw-bold transition-all" 
              [style.background]="type() === 'COUNT' ? 'white' : 'transparent'"
              [style.color]="type() === 'COUNT' ? 'black' : '#8E8E93'"
              (click)="type.set('COUNT')">Count</button>
    </div>
  </div>

  <!-- Target Value -->
  <div class="mb-4">
    <label class="text-secondary small fw-bold uppercase mb-2 px-1" style="letter-spacing: 0.5px; font-size: 10px;">Daily Goal</label>
    <div class="d-flex align-items-center gap-3" style="background: #1C1C1E; border-radius: 16px; padding: 4px 16px; border: 1px solid rgba(255,255,255,0.05);">
      <input type="number" class="form-control border-0 bg-transparent text-white py-3 fw-bold fs-4" 
             [ngModel]="target()" (ngModelChange)="target.set($event)" style="width: 100px;">
      <span class="text-secondary fw-bold">{{ type() === 'TIME' ? 'minutes' : 'times' }}</span>
    </div>
  </div>

  <!-- Category Selection -->
  <div class="mb-5">
    <label class="text-secondary small fw-bold uppercase mb-2 px-1" style="letter-spacing: 0.5px; font-size: 10px;">Category</label>
    <div class="d-flex gap-2">
      <button class="btn flex-grow-1 border-0 d-flex flex-column align-items-center py-3 gap-2" 
              style="border-radius: 16px; transition: 0.2s;"
              [style.background]="category() === 'HEALTH' ? 'rgba(0, 208, 132, 0.15)' : '#1C1C1E'"
              (click)="category.set('HEALTH')">
        <i class="bi bi-heart-pulse-fill" [style.color]="category() === 'HEALTH' ? '#00D084' : '#48484A'"></i>
        <span class="small fw-bold" [style.color]="category() === 'HEALTH' ? 'white' : '#8E8E93'">Health</span>
      </button>
      <button class="btn flex-grow-1 border-0 d-flex flex-column align-items-center py-3 gap-2" 
              style="border-radius: 16px; transition: 0.2s;"
              [style.background]="category() === 'WORK' ? 'rgba(0, 117, 255, 0.15)' : '#1C1C1E'"
              (click)="category.set('WORK')">
        <i class="bi bi-briefcase-fill" [style.color]="category() === 'WORK' ? '#0075FF' : '#48484A'"></i>
        <span class="small fw-bold" [style.color]="category() === 'WORK' ? 'white' : '#8E8E93'">Work</span>
      </button>
      <button class="btn flex-grow-1 border-0 d-flex flex-column align-items-center py-3 gap-2" 
              style="border-radius: 16px; transition: 0.2s;"
              [style.background]="category() === 'LIFE' ? 'rgba(255, 255, 255, 0.1)' : '#1C1C1E'"
              (click)="category.set('LIFE')">
        <i class="bi bi-stars" [style.color]="category() === 'LIFE' ? 'white' : '#48484A'"></i>
        <span class="small fw-bold" [style.color]="category() === 'LIFE' ? 'white' : '#8E8E93'">Life</span>
      </button>
    </div>
  </div>

  <!-- Final Actions -->
  <div class="d-flex flex-column gap-2">
    <button class="btn btn-rev-white py-3 fw-bold rounded-pill w-100" style="font-size: 17px;"
            (click)="create()" [disabled]="loading() || !name()">
      <span *ngIf="!loading()">Create Habit</span>
      <span *ngIf="loading()" class="spinner-border spinner-border-sm text-black"></span>
    </button>
    <button class="btn btn-link text-secondary text-decoration-none w-100 py-2 fw-bold" 
            (click)="activeModal.dismiss()">Cancel</button>
  </div>
</div>
