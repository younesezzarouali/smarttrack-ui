<div class="p-4" style="background: var(--elevated-surface); color: var(--primary-text); border-radius: var(--radius-modal); border: var(--border);">
  <h4 class="mb-4" style="font-size: 20px; font-weight: 600; letter-spacing: -0.5px;">New Expense</h4>
  
  <div class="mb-4">
    <label class="d-block mb-2" style="font-size: 11px; color: var(--muted-text); text-transform: uppercase; letter-spacing: 1px;">Description</label>
    <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px 16px;">
      <input type="text" class="form-control border-0 bg-transparent text-white p-0" 
             style="font-size: 16px; font-weight: 500; outline: none; box-shadow: none;" placeholder="e.g. Cloud Subscription" 
             [value]="label()" (input)="label.set($any($event.target).value)" autofocus>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6">
      <label class="d-block mb-2" style="font-size: 11px; color: var(--muted-text); text-transform: uppercase; letter-spacing: 1px;">Amount</label>
      <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center;">
        <input type="number" class="form-control border-0 bg-transparent text-white p-0" 
               style="font-size: 15px; font-weight: 500; outline: none; box-shadow: none;" placeholder="0.00"
               [value]="amount()" (input)="amount.set($any($event.target).value)">
        <span class="ms-2" style="color: var(--secondary-text);">€</span>
      </div>
    </div>
    <div class="col-6">
      <label class="d-block mb-2" style="font-size: 11px; color: var(--muted-text); text-transform: uppercase; letter-spacing: 1px;">Category</label>
      <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px 16px;">
        <select class="form-select border-0 bg-transparent text-white p-0" 
                style="font-size: 15px; font-weight: 500; outline: none; box-shadow: none; cursor: pointer;" 
                [value]="category()" (change)="category.set($any($event.target).value)">
          <option value="FOOD" style="background: var(--elevated-surface);">Food</option>
          <option value="TRANSPORT" style="background: var(--elevated-surface);">Transport</option>
          <option value="HOUSING" style="background: var(--elevated-surface);">Housing</option>
          <option value="ENTERTAINMENT" style="background: var(--elevated-surface);">Entertainment</option>
          <option value="HEALTH" style="background: var(--elevated-surface);">Health</option>
          <option value="OTHER" style="background: var(--elevated-surface);">Other</option>
        </select>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-end align-items-center gap-3 mt-2">
    <button class="btn btn-link text-decoration-none p-0" 
            style="font-size: 14px; font-weight: 500; color: var(--secondary-text);" 
            (click)="activeModal.dismiss()">Cancel</button>
    <button class="btn px-4 py-3" 
            style="background: var(--primary-accent); color: white; border-radius: 12px; font-weight: 600; border: none; min-width: 140px;" 
            (click)="addExpense()">
      Save Transaction
    </button>
  </div>
</div>
