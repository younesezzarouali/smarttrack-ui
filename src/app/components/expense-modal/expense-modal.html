<div class="modal-container-p">
  <h4 class="text-title-2 mb-4">New Expense</h4>
  
  <div class="form-group-p">
    <label class="text-label-caps d-block mb-2">Description</label>
    <div class="input-container-p">
      <input type="text" class="input-p" placeholder="e.g. Cloud Subscription" 
             [value]="label()" (input)="label.set($any($event.target).value)" autofocus>
    </div>
  </div>

  <div class="row g-3 form-group-p">
    <div class="col-6">
      <label class="text-label-caps d-block mb-2">Amount</label>
      <div class="input-container-p">
        <input type="number" class="input-p" placeholder="0.00"
               [value]="amount()" (input)="amount.set($any($event.target).value)">
        <span class="ms-2 text-secondary">€</span>
      </div>
    </div>
    <div class="col-6">
      <label class="text-label-caps d-block mb-2">Category</label>
      <div class="input-container-p">
        <select class="input-p" [value]="category()" (change)="category.set($any($event.target).value)">
          <option value="FOOD" style="background: var(--elevated-surface);">Food</option>
          <option value="TRANSPORT" style="background: var(--elevated-surface);">Transport</option>
          <option value="HOUSING" style="background: var(--elevated-surface);">Housing</option>
          <option value="ENTERTAINMENT" style="background: var(--elevated-surface);">Entertainment</option>
          <option value="HEALTH" style="background: var(--elevated-surface);">Health</option>
          <option value="OTHER" style="background: var(--elevated-surface);">Other</option>
        </select>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-end align-items-center gap-3 mt-4">
    <button class="btn-link-p" (click)="activeModal.dismiss()">Cancel</button>
    <button class="btn-premium px-4" (click)="addExpense()">
      Save Transaction
    </button>
  </div>
</div>
