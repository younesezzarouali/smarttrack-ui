<div class="modal-body p-4">
  <div class="mb-4">
    <label class="form-label text-uppercase small fw-bold" style="color: var(--neon-cyan); letter-spacing: 1px;">DESCRIPTION</label>
    <input type="text"
           class="form-control form-control-lg rounded-0"
           placeholder="Ex: Cyber-Implants"
           [value]="label()"
           (input)="label.set($any($event.target).value)" 
           style="background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: white;"/>
  </div>

  <div class="mb-4">
    <label class="form-label text-uppercase small fw-bold" style="color: var(--neon-cyan); letter-spacing: 1px;">AMOUNT</label>
    <div class="input-group">
      <input type="number"
             class="form-control form-control-lg rounded-0"
             placeholder="0.00"
             [value]="amount()"
             (input)="amount.set($any($event.target).value)"
             style="background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: white; font-family: var(--font-display);"/>
      <span class="input-group-text bg-transparent border-0 text-white fw-bold">€</span>
    </div>
  </div>

  <div class="mb-5">
    <label class="form-label text-uppercase small fw-bold" style="color: var(--neon-cyan); letter-spacing: 1px;">CATEGORY</label>
    <select class="form-select form-select-lg rounded-0"
            [value]="category()"
            (change)="category.set($any($event.target).value)"
            style="background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: white;">
      <option value="FOOD">NOURRITURE</option>
      <option value="TRANSPORT">TRANSPORT</option>
      <option value="HOUSING">LOGEMENT</option>
      <option value="ENTERTAINMENT">DIVERTISSEMENT</option>
      <option value="HEALTH">SANTÉ</option>
      <option value="OTHER">AUTRE</option>
    </select>
  </div>

  <div class="d-grid">
    <button class="btn-neon w-100" (click)="addExpense()">
      CONFIRM UPLOAD
    </button>
  </div>
</div>
