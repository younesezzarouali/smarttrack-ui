<div class="row g-3 mb-4">
  <div class="col-4">
    <div class="card-premium d-flex flex-column align-items-center justify-content-center p-3 mb-0">
      <span style="font-size: 11px; color: var(--muted-text); text-transform: uppercase; letter-spacing: 1px;">Spent</span>
      <div class="text-white fw-bold fs-4 mt-1">{{ totalSpent() | number:'1.0-0' }}€</div>
    </div>
  </div>

  <div class="col-4">
    <div class="card-premium d-flex flex-column align-items-center justify-content-center p-3 mb-0">
      <span style="font-size: 11px; color: var(--muted-text); text-transform: uppercase; letter-spacing: 1px;">Work</span>
      <div class="text-white fw-bold fs-4 mt-1">{{ workHoursStr() }}h</div>
    </div>
  </div>

  <div class="col-4">
    <div class="card-premium d-flex flex-column align-items-center justify-content-center p-3 mb-0">
      <span style="font-size: 11px; color: var(--muted-text); text-transform: uppercase; letter-spacing: 1px;">Vitality</span>
      <div class="fw-bold fs-4 mt-1" [style.color]="vitalityScore() > 70 ? 'var(--success-accent)' : 'white'">{{ vitalityScore() }}%</div>
    </div>
  </div>
</div>

<!-- Weekly Target -->
<div class="card-premium mb-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h6 style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--muted-text); letter-spacing: 0.5px; margin: 0;">Weekly Goal</h6>
    <span class="badge rounded-pill px-3 py-1" style="font-size: 10px; background: rgba(76, 141, 255, 0.1); color: var(--primary-accent); border: 1px solid rgba(76, 141, 255, 0.2);">PRO</span>
  </div>
  
  <div class="d-flex flex-column gap-4">
    <div>
      <div class="d-flex justify-content-between align-items-end mb-2">
        <span class="text-white fw-semibold" style="font-size: 15px;">Budget Plan</span>
        <span style="color: var(--secondary-text); font-size: 13px;">{{ totalSpent() | number:'1.0-0' }} / {{ GOALS.budget }}€</span>
      </div>
      <div class="progress-bar-p">
        <div class="progress-fill-p" [style.width.%]="budgetProgress()" [style.background]="budgetProgress() > 90 ? '#FF453A' : 'var(--progress-gradient)'"></div>
      </div>
    </div>

    <div>
      <div class="d-flex justify-content-between align-items-end mb-2">
        <span class="text-white fw-semibold" style="font-size: 15px;">Deep Work Focus</span>
        <span style="color: var(--secondary-text); font-size: 13px;">{{ workHoursStr() }} / {{ GOALS.work }}h</span>
      </div>
      <div class="progress-bar-p">
        <div class="progress-fill-p" [style.width.%]="workProgress()"></div>
      </div>
    </div>
  </div>
</div>
