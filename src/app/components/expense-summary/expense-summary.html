<div *ngIf="summary() as s" class="row g-4">
  <div class="col-md-4">
    <div class="card shadow-sm border-0 border-start border-primary border-4">
      <div class="card-body">
        <h6 class="text-muted small text-uppercase fw-bold">Total Dépensé</h6>
        <h2 class="mb-0">{{ s.total }} €</h2>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card shadow-sm border-0 border-start border-success border-4">
      <div class="card-body">
        <h6 class="text-muted small text-uppercase fw-bold">Transactions</h6>
        <h2 class="mb-0">{{ s.count }}</h2>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card shadow-sm border-0 border-start border-info border-4">
      <div class="card-body">
        <h6 class="text-muted small text-uppercase fw-bold">Période</h6>
        <h2 class="mb-0 h4">{{ s.period }}</h2>
      </div>
    </div>
  </div>
</div>

<div *ngIf="summary() as s" class="mt-4 p-4 bg-white shadow-sm rounded">
  <h6 class="fw-bold mb-3">Détail par catégorie</h6>
  <div *ngFor="let cat of getCategories()" class="mb-2">
    <div class="d-flex justify-content-between mb-1">
      <span>{{ cat }}</span>
      <span class="fw-bold">{{ s.totalByCategory[cat] }} €</span>
    </div>
    <div class="progress" style="height: 8px;">
      <div class="progress-bar bg-primary" [style.width.%]="(s.totalByCategory[cat] / s.total) * 100"></div>
    </div>
  </div>
</div>
