<!-- DASHBOARD CARD -->
<section *ngIf="expenseSummary() as summary" class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow">
        <div class="card-body">
          <h5 class="card-title text-center fw-bold mb-4">Aperçu du mois</h5>

          <div class="row text-center mb-2">
            <div class="col"><small class="text-muted">Total</small>
              <h6 class="fw-bold">{{summary.total}} €</h6>
            </div>
            <div class="col"><small class="text-muted">Budget</small>
              <h6 class="fw-bold">{{summary.monthlyBudget}} €</h6>
            </div>
            <div class="col" [ngClass]="summary.getRemainingBudget() >= 0 ? 'text-success' : 'text-danger'">
              <small class="text-muted">Reste</small>
              <h6 class="fw-bold">{{summary.getRemainingBudget()}} €</h6>
            </div>
          </div>

          <!-- Overall Budget Progress -->
          <div class="mb-4">
            <div class="progress" style="height: 10px;">
              <div class="progress-bar" role="progressbar" 
                [ngClass]="summary.getBudgetProgress() > 90 ? 'bg-danger' : 'bg-success'"
                [style.width.%]="summary.getBudgetProgress()">
              </div>
            </div>
          </div>

          <h6 class="fw-bold mb-3">Répartition par catégorie</h6>
          <!-- Progress bars -->
          @for (category of categories(summary); track category) {
          <div class="mb-3">
            <div class="d-flex justify-content-between mb-1">
              <small class="text-muted text-capitalize">{{category.toLowerCase()}}</small>
              <small class="fw-bold">{{summary.totalByCategory[category]}} €</small>
            </div>
            <div class="progress" style="height: 8px;">
              <div class="progress-bar bg-success" [style.width.%]="summary.getPercentage(category)">
              </div>
            </div>
          </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
