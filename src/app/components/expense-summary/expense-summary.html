<div class="row g-3 mb-4">
  <div class="col-4">
    <div class="card-rev d-flex flex-column align-items-center justify-content-center p-3">
      <span class="kpi-label" style="font-size: 10px;">Spent</span>
      <div class="text-white fw-bold fs-3 mt-1">{{ totalSpent() | number:'1.0-0' }}€</div>
    </div>
  </div>

  <div class="col-4">
    <div class="card-rev d-flex flex-column align-items-center justify-content-center p-3">
      <span class="kpi-label" style="font-size: 10px;">Work</span>
      <div class="text-white fw-bold fs-3 mt-1">{{ workHoursStr() }}h</div>
    </div>
  </div>

  <div class="col-4">
    <div class="card-rev d-flex flex-column align-items-center justify-content-center p-3">
      <span class="kpi-label" style="font-size: 10px;">Vitality</span>
      <div class="fw-bold fs-3 mt-1" [style.color]="vitalityScore() > 70 ? 'var(--rev-success)' : 'white'">{{ vitalityScore() }}%</div>
    </div>
  </div>
</div>

<!-- Weekly Target (High Contrast) -->
<div class="card-rev mb-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h6 class="kpi-label m-0">Weekly Goal</h6>
    <span class="badge bg-white bg-opacity-10 text-white rounded-pill px-2" style="font-size: 10px;">PRO</span>
  </div>
  
  <div class="d-flex flex-column gap-4">
    <div>
      <div class="d-flex justify-content-between align-items-end mb-2">
        <span class="text-white fw-bold">Budget Plan</span>
        <span class="text-grey small">{{ totalSpent() | number:'1.0-0' }} / {{ GOALS.budget }}€</span>
      </div>
      <div class="prog-container">
        <div class="prog-fill" [style.width.%]="budgetProgress()" [class.success]="budgetProgress() <= 100" [style.background]="budgetProgress() > 90 ? 'var(--rev-danger)' : 'var(--rev-blue)'"></div>
      </div>
    </div>

    <div>
      <div class="d-flex justify-content-between align-items-end mb-2">
        <span class="text-white fw-bold">Deep Work Focus</span>
        <span class="text-grey small">{{ workHoursStr() }} / {{ GOALS.work }}h</span>
      </div>
      <div class="prog-container">
        <div class="prog-fill" [style.width.%]="workProgress()"></div>
      </div>
    </div>
  </div>
</div>
