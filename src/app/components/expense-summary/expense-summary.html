<div class="row g-3 mb-4">
  <div class="col-4">
    <div class="card-premium d-flex flex-column align-items-center justify-content-center p-3">
      <span class="text-label-caps">Spent</span>
      <div class="text-title-2 mt-1">{{ totalSpent() | number:'1.0-0' }}€</div>
    </div>
  </div>

  <div class="col-4">
    <div class="card-premium d-flex flex-column align-items-center justify-content-center p-3">
      <span class="text-label-caps">Work</span>
      <div class="text-title-2 mt-1">{{ workHoursStr() }}h</div>
    </div>
  </div>

  <div class="col-4">
    <div class="card-premium d-flex flex-column align-items-center justify-content-center p-3">
      <span class="text-label-caps">Vitality</span>
      <div class="text-title-2 mt-1" [style.color]="vitalityScore() > 70 ? 'var(--success)' : 'white'">{{ vitalityScore() }}%</div>
    </div>
  </div>
</div>

<!-- Weekly Target -->
<div class="card-premium mb-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h6 class="text-label-caps m-0" style="color: var(--primary-text);">Weekly Goal</h6>
    <span class="badge-mini completed" style="background: var(--accent-soft); color: var(--primary-accent); border: 1px solid var(--accent-border);">PRO</span>
  </div>
  
  <div class="d-flex flex-column gap-4">
    <div>
      <div class="d-flex justify-content-between align-items-end mb-2">
        <span class="text-body-p text-white">Budget Plan</span>
        <span class="text-body-p text-secondary" style="font-size: 13px;">{{ totalSpent() | number:'1.0-0' }} / {{ GOALS.budget }}€</span>
      </div>
      <div class="progress-bar-p">
        <div class="progress-fill-p" [style.width.%]="budgetProgress()" [style.background]="budgetProgress() > 90 ? 'var(--danger)' : 'var(--progress-gradient)'"></div>
      </div>
    </div>

    <div>
      <div class="d-flex justify-content-between align-items-end mb-2">
        <span class="text-body-p text-white">Deep Work Focus</span>
        <span class="text-body-p text-secondary" style="font-size: 13px;">{{ workHoursStr() }} / {{ GOALS.work }}h</span>
      </div>
      <div class="progress-bar-p">
        <div class="progress-fill-p" [style.width.%]="workProgress()"></div>
      </div>
    </div>
  </div>
</div>
