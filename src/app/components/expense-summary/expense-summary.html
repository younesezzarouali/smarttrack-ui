<div class="row g-3 section-spacer">
  <!-- KPI Metrics -->
  <div class="col-4">
    <div class="apple-card h-100 d-flex flex-column justify-content-center text-center">
      <div class="kpi-label">Spent</div>
      <div class="kpi-value text-white">{{ totalSpent() | number:'1.0-0' }}€</div>
    </div>
  </div>

  <div class="col-4">
    <div class="apple-card h-100 d-flex flex-column justify-content-center text-center">
      <div class="kpi-label">Work</div>
      <div class="kpi-value text-white">{{ workHoursStr() }}h</div>
    </div>
  </div>

  <div class="col-4">
    <div class="apple-card h-100 d-flex flex-column justify-content-center text-center">
      <div class="kpi-label">Vitality</div>
      <div class="kpi-value text-white">{{ vitalityScore() }}%</div>
    </div>
  </div>
</div>

<!-- Weekly Focus -->
<div class="row section-spacer">
  <div class="col-12">
    <div class="apple-card">
      <h6 class="kpi-label mb-4">Weekly Objectives</h6>
      
      <div class="row g-4">
        <div class="col-md-4">
          <div class="d-flex justify-content-between mb-2">
            <span class="small text-secondary">Budget</span>
            <span class="small text-white opacity-75">{{ totalSpent() | number:'1.0-0' }} / {{ GOALS.budget }}€</span>
          </div>
          <div class="progress">
            <div class="progress-bar" [style.width.%]="budgetProgress()" 
                 [style.background-color]="budgetProgress() > 90 ? 'var(--ios-red)' : 'white'"></div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="d-flex justify-content-between mb-2">
            <span class="small text-secondary">Health</span>
            <span class="small text-white opacity-75">{{ healthActivities() }} acts</span>
          </div>
          <div class="progress">
            <div class="progress-bar" [style.width.%]="sportProgress()"></div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="d-flex justify-content-between mb-2">
            <span class="small text-secondary">Productivity</span>
            <span class="small text-white opacity-75">{{ workHoursStr() }} / {{ GOALS.work }}h</span>
          </div>
          <div class="progress">
            <div class="progress-bar" [style.width.%]="workProgress()"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
